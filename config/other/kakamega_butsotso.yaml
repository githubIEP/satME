## Kakamega — Butsotso Ward (Site 02)
## Kakamega County, Lurambi sub-county, western Kenya
## NATURAL RAINFALL-DRIVEN — smallholder maize intercropped with beans, cassava, sorghum
##
## Wet/dry season analysis
##   Dry window  : January – February (bare soil, land prep)
##   Wet window  : May – June (long rains peak, max NDVI)
##   Recommended : compare February images vs May images
##
## Key cautions:
##   - Heavy cloud cover May–Jun: cloud thresholds raised to capture wet-season images
##   - Fields never fully bare — cassava and hedgerows stay green year-round
##   - 2019 was a drought year (suppressed NDVI); exclude manually if needed
##
## NOTE: reference_date is a mid-study marker for PRE/POST labelling only.
##       This site has no infrastructure intervention — PRE/POST = before/after 2022.

auth:
  gee_project: ""   # set your GEE project ID here or use EARTHENGINE_PROJECT env var

run:
  name: "kakamega_butsotso_wet_dry"
  reference_date: "2022-01-01"   # mid-study split; not tied to an event

aoi:
  mode: "polygon"
  # Sample polygon from site reference document — approx. 3 km × 3 km smallholder block
  # Source coords given as (lat, lon); converted here to [lon, lat] for GEE
  coordinates:
    - [34.74, 0.27]   # SW
    - [34.77, 0.27]   # SE
    - [34.77, 0.30]   # NE
    - [34.74, 0.30]   # NW
    - [34.74, 0.27]   # close ring

date_range:
  start: "2019-01-01"
  end:   "2024-12-31"

season:
  # January–February (dry/bare) + May–June (wet/green peak)
  target_months: [1, 2, 5, 6]
  flag_only: false   # exclude images outside the target windows

sources:
  sentinel2:
    enabled: true
    collection: "COPERNICUS/S2_SR_HARMONIZED"

    # Cloud thresholds — raised for wet season (May–Jun is heavily cloud-covered)
    max_tile_cloud_pct: 70
    max_aoi_cloud_pct:  40

    indices:
      - NDVI    # primary vegetation health — main wet/dry contrast metric
      - BSI     # bare soil index — high in dry season, low in wet season
      - NDMI    # soil/vegetation moisture — complements NDVI

    export_geotiff: false

  chirps:
    enabled: true
    collection: "UCSB-CHG/CHIRPS/DAILY"
    accumulation_days: 30   # monthly antecedent rainfall — key driver of NDVI here
    export_geotiff: false

output:
  base_dir: "outputs/runs"
  stats_csv: true
  flag_report: true
  skip_existing: true
  download_method: "local"

stats:
  percentiles: [10, 25, 50, 75, 90]
  include_mean:    true
  include_stddev:  true
  include_min_max: true
