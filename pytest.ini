[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Custom markers
markers =
    gee: marks tests that require a live GEE connection (deselect with -m "not gee")
    slow: marks tests that take > 30 seconds (deselect with -m "not slow")

# Default: run everything except tests marked slow
# To run only unit tests:  pytest -m "not gee"
# To run all including GEE: pytest -m "gee" or just pytest

addopts = -v --tb=short
